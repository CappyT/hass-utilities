name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'CappyT/hass-utilities'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      slug: ${{ steps.normalize.outputs.slug }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      # The info helper returns every value JSON-encoded.
      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
          DESCRIPTION: ${{ steps.info.outputs.description }}
          URL: ${{ steps.info.outputs.url }}
          SLUG: ${{ steps.info.outputs.slug }}
          APP: ${{ inputs.app }}
        run: |
          ref=$(jq -r . <<< "${IMAGE}")
          if [[ -z "${ref}" || "${ref}" == "null" ]]; then
            echo "::error::${APP}/config.yaml sets no image"
            exit 1
          fi
          url=$(jq -r . <<< "${URL}")
          {
            echo "image_name=${ref##*/}"
            echo "registry_prefix=${ref%/*}"
            echo "version=$(jq -r . <<< "${VERSION}")"
            echo "name=$(jq -r . <<< "${NAME}")"
            echo "description=$(jq -r . <<< "${DESCRIPTION}")"
            echo "slug=$(jq -r . <<< "${SLUG}")"
            if [[ -n "${url}" && "${url}" != "null" ]]; then
              echo "url=${url}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # skip-existing keeps a published version immutable: a change needs a version bump.
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: ${{ inputs.app }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}

  release:
    name: Publish GitHub release
    needs: [prepare, manifest]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create the release of this version with its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          NAME: ${{ needs.prepare.outputs.name }}
          TAG: ${{ needs.prepare.outputs.slug }}-v${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists"
            exit 0
          fi
          notes=$(awk -v heading="### ${VERSION}" '$0 == heading { found = 1; next } /^### / { found = 0 } found' "${APP}/CHANGELOG.md")
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::${APP}/CHANGELOG.md has no '### ${VERSION}' section"
            exit 1
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "${NAME} ${VERSION}" --notes "${notes}"
